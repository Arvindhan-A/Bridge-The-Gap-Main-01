{% extends "base.html" %}
{% block title %}Event | Admin{% endblock %}
{% block content %}
<div class="admin-wrap">
    <div class="admin-header">
        <h1>{{ event.title if event else 'Create Event' }}</h1>
        <div class="admin-header-actions">
            <a href="{{ url_for('admin.legacy') }}" class="btn-outline btn-sm">Back</a>
        </div>
    </div>

    <div class="admin-section">
        <form method="POST" enctype="multipart/form-data" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);">
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Event Title *</label>
                <input type="text" name="title" placeholder="Event title" required value="{{ event.title if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Date *</label>
                <input type="date" name="date" required value="{{ event.date.strftime('%Y-%m-%d') if event and event.date else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Time</label>
                <input type="text" name="time" placeholder="Time (e.g. 10:00 AM)" value="{{ event.time if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Chapter</label>
                <select name="chapter_id">
                    <option value="">No chapter (standalone event)</option>
                    {% for c in chapters %}
                    <option value="{{ c.id }}" {{ 'selected' if event and event.chapter_id == c.id else '' }}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Status</label>
                <select name="status">
                    <option value="published" {{ 'selected' if event and event.status == 'published' else '' }}>Published</option>
                    <option value="upcoming" {{ 'selected' if event and event.status == 'upcoming' else '' }}>Upcoming</option>
                    <option value="ongoing" {{ 'selected' if event and event.status == 'ongoing' else '' }}>Ongoing</option>
                    <option value="completed" {{ 'selected' if event and event.status == 'completed' else '' }}>Completed</option>
                </select>
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Venue</label>
                <input type="text" name="venue" placeholder="Venue / Location" value="{{ event.venue if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Address</label>
                <input type="text" name="address" placeholder="Street / area / city" value="{{ event.address if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Author</label>
                <input type="text" name="author" placeholder="Author" value="{{ event.author if event and event.author else 'Admin' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Registration Link</label>
                <input type="url" name="registration_link" placeholder="https://example.com/register" value="{{ event.registration_link if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Contact Email</label>
                <input type="email" name="contact_email" placeholder="organizer@chapter.org" value="{{ event.contact_email if event else '' }}">
            </div>
            <div class="form-group" style="margin:0;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Max Participants</label>
                <input type="number" name="max_participants" min="1" placeholder="e.g. 50" value="{{ event.max_participants if event and event.max_participants else '' }}">
            </div>
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Short Description</label>
                <textarea name="description" rows="3" placeholder="Event description">{{ event.description if event else '' }}</textarea>
            </div>
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Full Content (HTML supported)</label>
                <textarea name="content" rows="6" placeholder="Event content">{{ event.content if event else '' }}</textarea>
            </div>
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Banner Image</label>
                <input type="file" name="banner" accept="image/*">
                {% if event and event.banner %}
                <div style="margin-top:0.5rem;"><img src="{{ url_for('static', filename=event.banner) }}" style="max-height:80px;border-radius:var(--r-sm);"></div>
                {% endif %}
            </div>
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Event Photos (select multiple, add a caption to each)</label>
                <input type="file" name="gallery_images" id="galleryInput" accept="image/*" multiple>
                <div id="galleryPreview"></div>
            </div>
            {% if event and event.images %}
            <div class="form-group" style="margin:0;grid-column:1/-1;">
                <label style="font-size:0.875rem;font-weight:600;display:block;margin-bottom:0.3rem;">Current Photos</label>
                <div class="event-photo-manager">
                    {% for img in event.images %}
                    <div class="event-photo-item">
                        <img src="{{ url_for('static', filename=img.image) }}" alt="">
                        <input type="text" name="caption_{{ img.id }}" value="{{ img.caption }}" placeholder="Caption">
                        <label class="event-photo-remove">
                            <input type="checkbox" name="remove_image" value="{{ img.id }}">
                            Remove
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
            <div style="grid-column:1/-1;">
                <button type="submit" class="btn btn-sm">Update Event</button>
                <a href="{{ url_for('admin.legacy') }}" class="btn-outline btn-sm" style="margin-left:0.5rem;">Cancel</a>
            </div>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        </form>
    </div>
</div>

<style>
.gallery-upload-row {
    display:flex;align-items:center;gap:0.75rem;margin-top:0.5rem;
    padding:0.5rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);
}
.gallery-upload-row .gallery-upload-thumb { width:64px;height:44px;object-fit:cover;border-radius:var(--r-sm);flex-shrink:0; }
.gallery-upload-row input[type="text"] { flex:1;min-width:0; }
.gallery-upload-row .btn-delete { white-space:nowrap; }
.event-photo-manager {
    display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0.75rem;
    max-height:320px;overflow-y:auto;padding:0.5rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface);
}
.event-photo-item {
    display:flex;flex-direction:column;gap:0.4rem;padding:0.5rem;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);
}
.event-photo-item img { width:100%;height:96px;object-fit:cover;border-radius:var(--r-sm); }
.event-photo-item input[type="text"] { font-size:0.75rem;padding:6px 8px; }
.event-photo-remove {
    display:flex;align-items:center;gap:6px;font-size:0.75rem;color:#dc2626;cursor:pointer;font-weight:600;
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const galleryInput = document.getElementById('galleryInput');
    const galleryPreview = document.getElementById('galleryPreview');
    let captions = [];
    function renderGallery() {
        if (!galleryPreview) return;
        galleryPreview.innerHTML = '';
        Array.from(galleryInput.files).forEach((file, i) => {
            const row = document.createElement('div');
            row.className = 'gallery-upload-row';
            const img = document.createElement('img');
            img.className = 'gallery-upload-thumb';
            img.src = URL.createObjectURL(file);
            const caption = document.createElement('input');
            caption.type = 'text';
            caption.name = 'gallery_captions';
            caption.placeholder = 'Caption for this photo (optional)';
            caption.value = captions[i] || '';
            caption.addEventListener('input', () => { captions[i] = caption.value; });
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'btn-delete';
            removeBtn.textContent = 'Remove';
            removeBtn.addEventListener('click', () => {
                const dt = new DataTransfer();
                captions.splice(i, 1);
                Array.from(galleryInput.files).forEach((f, idx) => { if (idx !== i) dt.items.add(f); });
                galleryInput.files = dt.files;
                renderGallery();
            });
            row.append(img, caption, removeBtn);
            galleryPreview.appendChild(row);
        });
    }
    if (galleryInput) galleryInput.addEventListener('change', renderGallery);
});
</script>
{% endblock %}
