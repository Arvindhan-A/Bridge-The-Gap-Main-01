{% extends "base.html" %}
{% block title %}File Too Large | BTG{% endblock %}
{% block content %}
<div style="text-align:center;padding:6rem 2rem;max-width:500px;margin:0 auto;">
    <h1 style="font-family:'Inter',sans-serif;font-size:4rem;font-weight:400;color:var(--accent);margin-bottom:0.5rem;">413</h1>
    <p style="font-size:1.125rem;color:var(--text-2);margin-bottom:0.5rem;">That upload was too large.</p>
    <p style="font-size:0.9375rem;color:var(--text-3);margin-bottom:2rem;">Each file can be up to 4 MB, and the whole upload up to 40 MB. Try uploading fewer or smaller files at once.</p>
    <a href="javascript:history.back()" class="btn">Go Back</a>
</div>
{% endblock %}
